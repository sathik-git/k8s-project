apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-cicd
  labels:
    app: cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd
  template:
    metadata:
      labels:
        app: cicd
    spec:
      containers:
      - name: cicd
        image: sathik2074751/cicd-image:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort : 3000


